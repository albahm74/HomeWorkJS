<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Удаление элемента</title>
</head>
<body>
  <p class="description">Первый абзац с классом description</p>
  <p>Обычный абзац без класса</p>
  <p class="description">Второй абзац с классом description</p>
  <p class="note">Абзац с другим классом</p>

  <button>Удалить элемент</button>

  <script>
    const button = document.querySelector('button');

    button.addEventListener('click', () => {
      const firstDescription = document.querySelector('.description');
      if (firstDescription) {
        firstDescription.remove();
      }
    });
  </script>
</body>
</html>
