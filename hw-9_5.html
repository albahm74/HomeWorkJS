<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Изменение текста у элементов с классом description</title>
</head>
<body>
  <p class="description">Это первый абзац с классом description</p>
  <p>Это абзац без класса</p>
  <p class="description">Это второй абзац с классом description</p>
  <p class="note">Это абзац с другим классом</p>

  <script>
    const descriptions = document.querySelectorAll('.description');

    descriptions.forEach(element => {
      element.textContent = 'Новый текст';
    });
  </script>
</body>
</html>
